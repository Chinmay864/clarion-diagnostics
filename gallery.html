<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clarion Diagnostics - Facility Gallery</title>

  <style>
    /* Global Theme & Typography (Task 3) */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8fafc;
      color: #334155;
      margin: 0;
      padding: 0;
    }

    /* Page Header */
    header {
      background-color: #0f4c81;
      color: #ffffff;
      text-align: center;
      padding: 25px 15px;
      border-bottom: 4px solid #0284c7;
    }

    header h1 {
      margin: 0;
      font-size: 2.2rem;
      color: #ffffff;
    }

    header h2 {
      margin-top: 5px;
      color: #e0f2fe;
      font-weight: 400;
      font-size: 1.3rem;
    }

    header p {
      color: #f0f9ff;
      margin-top: 8px;
      font-size: 0.95rem;
    }

    /* Gallery Container & Grid Layout (Task 6 & Task 9) */
    .container {
      width: 90%;
      max-width: 1100px;
      margin: 30px auto;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
      padding: 10px 0;
    }

    /* Gallery Card Styling (Task 6) */
    figure.gallery-card {
      margin: 0;
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.06);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    figure.gallery-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 18px rgba(2, 132, 199, 0.2);
      border-color: #0284c7;
    }

    .img-wrapper {
      overflow: hidden;
      height: 220px;
      background-color: #e2e8f0;
    }

    .gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    /* Hover Zoom Effect (Task 6) */
    figure.gallery-card:hover img {
      transform: scale(1.08);
    }

    figcaption {
      padding: 15px;
      text-align: center;
      font-weight: bold;
      color: #0f4c81;
      background-color: #ffffff;
      border-top: 1px solid #f1f5f9;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Clarion Diagnostics</h1>
    <h2>Facility & Equipment Gallery</h2>
    <p>Select any image below to explore details about our laboratory infrastructure.</p>
  </header>

  <div class="container">
    <div class="gallery-grid">

      <!-- Clinical Laboratory -->
      <figure class="gallery-card">
        <a href="clinical-lab.html" target="_blank">
          <div class="img-wrapper">
            <img src="https://images.squarespace-cdn.com/content/v1/56a042fb25981d9326c9bbdb/653b8a83-2aaf-41e8-9e2e-8cbee3e1abdf/Distinguishing+Between+Clinical+and+Laboratory+Research.jpg"
                 alt="Central Clinical Laboratory"
                 title="Click to view Central Laboratory information">
          </div>
        </a>
        <figcaption>Central Clinical Laboratory</figcaption>
      </figure>

      <!-- Blood Collection Room -->
      <figure class="gallery-card">
        <a href="blood-room.html" target="_blank">
          <div class="img-wrapper">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSPT_M-ZikGvbYfJgktai7nnbKpB-uglp7PvawbN0UXmM1OCahDLs9a8_lO&s=10.jpg"
                 alt="Phlebotomy & Sample Collection Suite"
                 title="Click to view Phlebotomy Suite information">
          </div>
        </a>
        <figcaption>Phlebotomy & Collection Suite</figcaption>
      </figure>

      <!-- Automated Analyzer -->
      <figure class="gallery-card">
        <a href="analyzer.html" target="_blank">
          <div class="img-wrapper">
            <img src="https://tiimg.tistatic.com/fp/1/003/686/automated-urine-analyzer-940.jpg"
                 alt="Automated Diagnostic Analyzer"
                 title="Click to view Automated Analyzer information">
          </div>
        </a>
        <figcaption>Automated Diagnostic Analyzer</figcaption>
      </figure>

      <!-- Sample Processing Area -->
      <figure class="gallery-card">
        <a href="sample-processing.html" target="_blank">
          <div class="img-wrapper">
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiPjAWswgxtlKBJ-YU1wa71BdjjeAMvEie4gr2puvld6R4v-pZGALzxyzI0SlvODqp860FoxYdJATM00PiCbizKImoSDQ82icW7BLMTHGcVazLajJu3Ayh4S9VpPtB2qbpuSP1TFVsm32Pa1WFxahesd5GQMkWiZkSGIF5E7_-ucQGssFMO4gQW48oWqjLS/w1200-h630-p-k-no-nu/cleanroom.png.jpg"
                 alt="Sample Processing Unit"
                 title="Click to view Sample Processing Area information">
          </div>
        </a>
        <figcaption>Sample Processing Area</figcaption>
      </figure>

    </div>
  </div>

</body>
</html>
