<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clarion Diagnostics - Health Information</title>

  <style>
    /* Global Theme & Typography (Task 3) */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8fafc;
      color: #334155;
      margin: 0;
      padding: 0;
    }

    /* Page Header */
    header {
      background-color: #0f4c81;
      color: #ffffff;
      text-align: center;
      padding: 25px 15px;
      border-bottom: 4px solid #0284c7;
    }

    header h1 {
      margin: 0;
      font-size: 2.2rem;
      color: #ffffff;
    }

    header h2 {
      margin-top: 5px;
      color: #e0f2fe;
      font-weight: 400;
      font-size: 1.3rem;
    }

    /* Container Layout (Task 9) */
    .container {
      width: 90%;
      max-width: 900px;
      margin: 30px auto;
    }

    /* Card Wrapper Layout (Task 5 - CSS Box Model) */
    .iframe-card {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      margin-bottom: 30px;
    }

    .iframe-card h3 {
      color: #0f4c81;
      border-bottom: 2px solid #0284c7;
      padding-bottom: 8px;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    /* Responsive Iframe Container */
    .responsive-iframe-wrapper {
      position: relative;
      width: 100%;
      height: 420px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      background-color: #f1f5f9;
    }

    .responsive-iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Clarion Diagnostics</h1>
    <h2>Health Information Resource Center</h2>
  </header>

  <div class="container">
    
    <!-- National Health Portal Card -->
    <div class="iframe-card">
      <h3>National Health Portal</h3>
      <div class="responsive-iframe-wrapper">
        <iframe src="https://www.mohfw.gov.in/"
                title="National Health Portal"
                loading="lazy">
        </iframe>
      </div>
    </div>

    <!-- Laboratory Location Card -->
    <div class="iframe-card">
      <h3>Laboratory Location</h3>
      <div class="responsive-iframe-wrapper">
        <iframe src="https://www.google.com/maps?q=Mumbai&amp;output=embed"
                title="Laboratory Location"
                loading="lazy">
        </iframe>
      </div>
    </div>

  </div>

</body>
</html>
